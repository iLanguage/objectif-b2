name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + tsc --noEmit)
        run: npm run lint
      - name: Test (Vitest)
        run: npm run test
      - name: Build (Vite)
        run: npm run build
      - name: Check build output exists
        run: test -f dist/index.html
